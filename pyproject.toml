[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcs"
version = "0.1.0"
description = "Meta crawler study: robots.txt treatment of Meta's crawlers by news publishers"
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.27",
  "tenacity>=8",
  "dnspython>=2.6",
  "tldextract>=5",
  "protego>=0.4",
  "selectolax>=0.3",
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "statsmodels>=0.14",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "pydantic>=2",
  "typer>=0.12",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
render = ["playwright>=1.45"]

[project.scripts]
mcs = "mcs.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
