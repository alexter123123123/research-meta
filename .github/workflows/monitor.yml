# Daily monitor: ran 21 Oct -> 3 Nov 2026. Stopped early at the owner's request (3 Nov);
# the schedule was removed. Manual dispatch only.
name: monitor
on:
  workflow_dispatch:
    inputs:
      label: { description: "Snapshot label override (e.g. T3)", default: "" }
concurrency: { group: live-fetch, cancel-in-progress: false }
permissions: { contents: write, pages: write, id-token: write }
jobs:
  monitor:
    environment: { name: github-pages }
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Date window guard
        id: guard
        run: |
          d=$(date -u +%Y%m%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$d" -ge 20261021 ] && [ "$d" -le 20261120 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/setup
      - if: steps.guard.outputs.run == 'true'
        name: Monitor
        run: mcs monitor --label "${{ inputs.label }}"
      - if: always() && steps.guard.outputs.run == 'true'
        run: 'scripts/commit_data.sh "data: daily monitor $(date -u +%F)"'
      - if: success() && steps.guard.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - if: success() && steps.guard.outputs.run == 'true'
        uses: actions/deploy-pages@v4
